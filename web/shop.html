<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>独立商店</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#263a35;font:15px/1.7 system-ui}main{max-width:1100px;margin:auto;padding:35px 22px}header{border-bottom:1px solid #ddd;padding-bottom:20px}h1{font-size:36px}h2{font-size:23px}.banner{background:#fbebc4;padding:15px;border-radius:8px;margin:20px 0}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}.card{background:white;padding:25px;border:1px solid #e0e5db;border-radius:12px;margin:20px 0}.card img{max-width:100%;max-height:320px;object-fit:contain}.price{font-size:25px;font-weight:700}button{padding:11px 18px;border:0;border-radius:6px;background:#197c68;color:white;cursor:pointer;font:inherit}button:disabled{opacity:.5}small{color:#6d8177}input{width:70px;padding:7px}#message{white-space:pre-wrap;color:#8e4e20}footer{border-top:1px solid #ddd;padding-top:20px;margin-top:30px}</style></head><body><main><header><small>INDEPENDENT STORE</small><h1 id="name">商店加载中…</h1></header><div id="mode"></div><div id="consent" class="banner">是否允许匿名记录访问、加购和结账，用于改善购物体验？不记录姓名、邮箱或地址。<br><button id="allow-analytics" data-en="Allow anonymous analytics">允许匿名分析</button> <button id="deny-analytics" data-en="Decline">暂不允许</button></div><section id="articles"></section><div id="products" class="products"></div><section class="card"><h2 data-en="Cart">购物车</h2><div id="cart"></div><button id="checkout" data-en="Checkout">继续下单</button><p id="message" role="status"></p></section><section class="card"><h2 data-en="Ask a question">咨询与售后</h2><form id="contact-form"><label><span data-en="Your reply email">用于本次回复的邮箱</span><input name="email" type="email" required style="width:100%"></label><label><span data-en="Subject">问题主题</span><input name="subject" maxlength="150" required style="width:100%"></label><label><span data-en="Your question">问题内容</span><textarea name="message" minlength="5" maxlength="3000" required style="width:100%;min-height:100px"></textarea></label><input name="website" tabindex="-1" autocomplete="off" hidden><label><input style="width:auto" name="ai_consent" type="checkbox"><span data-en="Allow AI to assist with this request (optional)">允许AI协助处理本次问题（可选）</span></label><p><button type="submit" data-en="Submit service request">提交服务请求</button></p><p id="contact-result" role="status"></p></form></section><footer><h2 data-en="Shipping and returns">配送与退换</h2><p id="shipping"></p><p id="returns"></p><small>收款与订单状态以商家核对结果为准。请勿在测试商店提交真实付款或个人资料。</small></footer></main><script src="/shop-ui.js"></script></body></html>
