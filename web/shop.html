<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>独立商店</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#263a35;font:15px/1.7 system-ui}main{max-width:1100px;margin:auto;padding:35px 22px}header{border-bottom:1px solid #ddd;padding-bottom:20px}h1{font-size:36px}h2{font-size:23px}.banner{background:#fbebc4;padding:15px;border-radius:8px;margin:20px 0}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}.card{background:white;padding:25px;border:1px solid #e0e5db;border-radius:12px;margin:20px 0}.price{font-size:25px;font-weight:700}button{padding:11px 18px;border:0;border-radius:6px;background:#197c68;color:white;cursor:pointer;font:inherit}button:disabled{opacity:.5}small{color:#6d8177}input{width:70px;padding:7px}#message{white-space:pre-wrap;color:#8e4e20}footer{border-top:1px solid #ddd;padding-top:20px;margin-top:30px}</style></head><body><main><header><small>INDEPENDENT STORE</small><h1 id="name">商店加载中…</h1></header><div id="mode"></div><div id="products" class="products"></div><section class="card"><h2>购物车</h2><div id="cart"></div><button id="checkout">继续下单</button><p id="message" role="status"></p></section><footer><h2>配送与退换</h2><p id="shipping"></p><p id="returns"></p><small>收款与订单状态以商家核对结果为准。请勿在测试商店提交真实付款或个人资料。</small></footer></main><script src="/shop-ui.js"></script></body></html>
