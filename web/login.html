<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 启航经营中台</title><style>body{margin:0;background:#132536;color:#223247;font:15px/1.7 system-ui;min-height:100vh;display:grid;place-items:center}.box{background:white;border-radius:18px;padding:38px;max-width:390px;margin:20px}h1{margin:0;color:#167765}p{color:#718393}input,button{box-sizing:border-box;padding:13px;width:100%;border-radius:7px;font:inherit;margin-top:12px}input{border:1px solid #d5dfe6}button{background:#188370;color:white;border:0;cursor:pointer}#error{color:#b44747}label{display:block}small{color:#83909c}</style><main class="box"><h1>◈ 启航</h1><h2>你的经营工作室</h2><p>输入部署时配置的访问密码，进入中台。</p><form id="login"><label>独立账号（管理员留空）<input name="username" autocomplete="username"></label><label>访问密码<input name="password" type="password" autocomplete="current-password" required></label><button>进入工作台</button><p id="error" role="alert"></p></form><small>管理员使用部署访问密码；独立账号的数据按工作区隔离。</small></main><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();let b=document.querySelector('button');b.disabled=true;try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:new FormData(e.target).get('username'),password:new FormData(e.target).get('password')})});let j=await r.json();if(!r.ok)throw Error(j.error);location.href='/'}catch(x){document.querySelector('#error').textContent=x.message}finally{b.disabled=false}};</script></html>
